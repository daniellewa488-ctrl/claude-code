name: Check Workflow Inbox

on:
  schedule:
    - cron: '*/5 * * * *'   # runs every 5 minutes
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  check-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: demo-website-generator/requirements.txt

      - name: Install dependencies
        run: pip install -r demo-website-generator/requirements.txt

      - name: Run inbox check
        working-directory: demo-website-generator
        run: python run_once.py
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STRATO_SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          STRATO_SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          STRATO_SFTP_PASS: ${{ secrets.STRATO_SFTP_PASS }}
          STRATO_SFTP_ROOT: ${{ secrets.STRATO_SFTP_ROOT }}
          PREVIEW_BASE_URL: ${{ secrets.PREVIEW_BASE_URL }}
